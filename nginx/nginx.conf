# Load balancer + reverse proxy in front of three Next.js replicas.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 64k;

  # ---- response compression (HTML, CSS, JS, JSON API payloads, SVG) ----
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml application/rss+xml image/svg+xml font/woff2;

  # ---- caches + limits ----
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=fm_cache:50m max_size=1g inactive=7d use_temp_path=off;
  limit_req_zone $binary_remote_addr zone=forms:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time '
                  'upstream=$upstream_addr cache=$upstream_cache_status';
  access_log /var/log/nginx/access.log main;

  # ---- load balancing: least connections, passive health checks, keep-alive to upstreams ----
  upstream flowmanic_app {
    least_conn;
    server app1:3000 max_fails=3 fail_timeout=15s;
    server app2:3000 max_fails=3 fail_timeout=15s;
    server app3:3000 max_fails=3 fail_timeout=15s;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # Hashed build assets: cache forever (filenames change on every deploy)
    location /_next/static/ {
      proxy_pass http://flowmanic_app;
      proxy_cache fm_cache;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache $upstream_cache_status;
    }

    # Optimised images and public illustrations
    location ~ ^/(_next/image|art/) {
      proxy_pass http://flowmanic_app;
      proxy_cache fm_cache;
      proxy_cache_valid 200 7d;
      proxy_cache_use_stale error timeout updating;
      add_header X-Cache $upstream_cache_status;
    }

    # Lead form: never cached, rate limited per IP
    location = /api/leads {
      limit_req zone=forms burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://flowmanic_app;
    }

    # Admin + health: never cached
    location ~ ^/(admin|api/health) {
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      proxy_pass http://flowmanic_app;
    }

    # Public JSON API: honour the app's s-maxage, serve stale while refreshing, collapse stampedes
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://flowmanic_app;
      proxy_cache fm_cache;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header X-Cache $upstream_cache_status;
    }

    # Pages: short micro-cache on top of Next's ISR (absorbs traffic spikes)
    location / {
      proxy_pass http://flowmanic_app;
      proxy_cache fm_cache;
      proxy_cache_key $scheme$host$request_uri;
      proxy_cache_valid 200 10s;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_bypass $http_authorization $http_rsc $http_next_router_state_tree;
      proxy_no_cache     $http_authorization $http_rsc $http_next_router_state_tree;
      add_header X-Cache $upstream_cache_status;
    }
  }
}
